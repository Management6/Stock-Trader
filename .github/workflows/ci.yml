name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python3 -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python3 -m ruff check .

      - name: Run unit tests
        run: python3 -m unittest discover -s tests

      - name: Run Phase 2 validation
        run: python3 scripts/run_phase2_validation.py --scenario all --output-root /tmp/phase2_validation

      - name: Run approval robustness smoke validation
        run: python3 scripts/run_phase2_validation.py --scenario approval_search_candidate_robustness --output-root /tmp/approval_robustness_validation
