operating_mode: "paper" # research, backtest, paper, live
data:
  provider: yfinance
  default_universe: full_mix
  symbols:
    - WES.AX
    - YAL.AX
    - SLX.AX
    - NVDA
  timeframe: 1d
  start_date: 2010-01-01
  end_date: null
  cache_dir: data/cache
  force_refresh: false
universes:
  core_asx:
    - CBA.AX
    - NAB.AX
    - ANZ.AX
    - WBC.AX
    - BHP.AX
    - RIO.AX
    - FMG.AX
    - CSL.AX
    - COH.AX
    - RMD.AX
    - WOW.AX
    - COL.AX
    - WES.AX
    - TCL.AX
    - MQG.AX
    - TLS.AX
    - YAL.AX
    - SLX.AX
  us_tech:
    - NVDA
    - AAPL
    - MSFT
    - AMD
    - PLTR
    - CRWD
    - PANW
    - MDB
    - GOOGL
    - AMZN
    - META
    - TSLA
  full_mix:
    - CBA.AX
    - NAB.AX
    - ANZ.AX
    - WBC.AX
    - BHP.AX
    - RIO.AX
    - FMG.AX
    - CSL.AX
    - COH.AX
    - RMD.AX
    - WOW.AX
    - COL.AX
    - WES.AX
    - TCL.AX
    - MQG.AX
    - TLS.AX
    - YAL.AX
    - SLX.AX
    - NVDA
    - AAPL
    - MSFT
    - AMD
    - PLTR
    - CRWD
    - PANW
    - MDB
    - GOOGL
    - AMZN
    - META
    - TSLA
strategy:
  name: moving_average_crossover
  version: "0.1.0"
  short_window: 5
  long_window: 20
strategy_families:
  - moving_average_crossover
strategies:
  moving_average_crossover:
    short_window:
      min: 5
      max: 50
    long_window:
      min: 20
      max: 200
    stop_loss_pct:
      min: 0.01
      max: 0.10
    take_profit_pct:
      min: 0.02
      max: 0.20
    default_variants: 5
  breakout_trend:
    breakout_window:
      min: 20
      max: 120
    exit_window:
      min: 5
      max: 60
    default_variants: 5
  moving_average_rsi_filter:
    short_window:
      min: 5
      max: 20
    long_window:
      min: 30
      max: 120
    rsi_period:
      min: 10
      max: 20
    rsi_min:
      min: 30
      max: 40
    rsi_max:
      min: 60
      max: 70
    default_variants: 5
research:
  variants_per_cycle: 5
  max_experiments_per_run: 5
  champion_band_enabled: true
  champion_band:
    example_ma:
      short_window:
        min: 45
        max: 50
      long_window:
        min: 105
        max: 120
oos_validation:
  enabled: true
  split_ratio: 0.70
  min_sharpe: 0.0
  max_drawdown: -0.20
  min_return: -0.05
data_quality:
  block_on_missing_columns: true
  block_on_duplicate_dates: true
  block_on_invalid_prices: true
  block_on_stale_data: false
  block_on_large_gaps: false
  block_on_zero_volume: false
  expect_volume: true
  max_gap_days: null
  max_staleness_days: null
portfolio:
  enabled: false
  allocation_method: equal_weight
  max_symbols: null
  min_valid_symbols: 3
  min_total_return: -0.02
  max_drawdown: -0.25
  min_sharpe: 0.0
  max_skipped_symbol_ratio: 0.50
regime:
  enabled: false
  benchmark_symbol: SPY
  lookback_days: 120
  trend_ma_days: 50
  max_volatility: 0.30
  allowed_regimes:
    - bullish
    - trending
  block_on_insufficient_data: true
strategy_search:
  focus_on_risk_passing_pct: 0.70
  explore_risky_pct: 0.20
  adaptive_narrowing_enabled: true
  top_good_experiment_count: 5
  risk_drawdown_buffer: 0.02
  adaptive_long_window_max: 140
  champion_band_focus_pct: 0.70
research_objective:
  type: sharpe
  sharpe:
    annualization_factor: 252
    min_history_points: 30
    fallback_return_weight: 1.0
    fallback_drawdown_penalty: 150.0
  custom:
    return_weight: 1.0
    drawdown_penalty: 1.0
execution:
  mode: "paper"
  dry_run: false
  default_quantity: 1
backtest:
  starting_capital: 100000
  max_capital_per_trade_pct: 0.10
  allow_leverage: false
  commission_per_trade: 0.0
  slippage_pct: 0.0005
risk:
  kill_switch_enabled: false
  min_backtest_return: -0.05
  max_drawdown_threshold: -0.20
  research:
    max_drawdown: -0.20
  paper:
    max_drawdown: -0.20
  max_position_size: 25
  max_capital_per_trade: 2500.0
  max_open_positions: 3
  daily_loss_limit: 1000.0
  allowed_symbols:
    - CBA.AX
    - NAB.AX
    - ANZ.AX
    - WBC.AX
    - BHP.AX
    - RIO.AX
    - FMG.AX
    - CSL.AX
    - COH.AX
    - RMD.AX
    - WOW.AX
    - COL.AX
    - WES.AX
    - TCL.AX
    - MQG.AX
    - TLS.AX
    - YAL.AX
    - SLX.AX
    - NVDA
    - AAPL
    - MSFT
    - AMD
    - PLTR
    - CRWD
    - PANW
    - MDB
    - GOOGL
    - AMZN
    - META
    - TSLA
  blocked_symbols: []
  trading_hours_start: "09:30"
  trading_hours_end: "16:00"
  enforce_trading_hours: false
  repeated_failure_limit: 3
experiment_log_path: "multi_agent_trading_lab/experiments/experiment_memory.jsonl"
audit_log_path: "multi_agent_trading_lab/experiments/audit_log.jsonl"
alert_log_path: "multi_agent_trading_lab/experiments/alerts.jsonl"
approval_queue_path: "multi_agent_trading_lab/state/strategy_approvals.json"
strategy_registry_path: "multi_agent_trading_lab/strategies/strategy_registry.json"
system_state_path: "multi_agent_trading_lab/state/system_state.json"
