[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-trading-lab"
version = "0.1.0"
description = "A clean multi-agent research lab for stock-market strategy experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Multi-Agent Trading Lab Contributors" }
]
dependencies = [
  "pandas>=2.0",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
market-data = []
dev = ["pytest>=8.0", "ruff>=0.4.0"]

[project.scripts]
trading-lab-example = "scripts.run_backtest_example:main"
trading-lab-discovery = "scripts.run_discovery:main"
trading-lab-research = "scripts.run_research_cycle:main"
trading-lab-paper = "scripts.run_paper_cycle:main"
trading-lab-download-data = "scripts.download_data:main"
trading-lab-analyze-ma = "scripts.analyze_example_ma:main"
trading-lab-research-batch = "scripts.run_research_batch:main"

[tool.setuptools.packages.find]
include = ["multi_agent_trading_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
